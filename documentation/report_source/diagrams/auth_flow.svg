<text xml:space="preserve" text-anchor="middle" x="387.04" y="-386.66" font-family="Helvetica,sans-Serif" font-size="15.00">POST /api/auth/login or /register: server</text>
<text xml:space="preserve" text-anchor="middle" x="387.04" y="-368.66" font-family="Helvetica,sans-Serif" font-size="15.00">validates input, checks or creates the bcrypt hash</text>
<text xml:space="preserve" text-anchor="middle" x="387.04" y="-350.66" font-family="Helvetica,sans-Serif" font-size="15.00">(10 rounds), signs a JWT valid for 7 days.</text>
<text xml:space="preserve" text-anchor="middle" x="387.04" y="-332.66" font-family="Helvetica,sans-Serif" font-size="15.00">Registration always creates a STUDENT.</text>
<text xml:space="preserve" text-anchor="middle" x="387.04" y="-314.66" font-family="Helvetica,sans-Serif" font-size="15.00">The app stores the token in Secure Store.</text>
</g>
